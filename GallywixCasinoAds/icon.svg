<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1a5c33"/>
      <stop offset="100%" stop-color="#0b3d20"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="45%" stop-color="#ffd200"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe985"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#7a5c00"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#goldRing)"/>
  <circle cx="256" cy="256" r="222" fill="url(#felt)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#ffe985" stroke-width="4" opacity="0.5"/>

  <!-- coin stack -->
  <g>
    <ellipse cx="256" cy="336" rx="92" ry="26" fill="#8a6400"/>
    <ellipse cx="256" cy="322" rx="92" ry="26" fill="url(#gold)" stroke="#7a5c00" stroke-width="4"/>
    <ellipse cx="256" cy="322" rx="92" ry="26" fill="none" stroke="#fff3b0" stroke-width="2" opacity="0.6"/>
    <text x="256" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="bold" fill="#7a5c00">$</text>
  </g>

  <!-- dice -->
  <g transform="translate(150,150) rotate(-18)">
    <rect x="0" y="0" width="72" height="72" rx="12" fill="#f5f0e6" stroke="#7a5c00" stroke-width="4"/>
    <circle cx="18" cy="18" r="7" fill="#c81e1e"/>
    <circle cx="54" cy="18" r="7" fill="#c81e1e"/>
    <circle cx="36" cy="36" r="7" fill="#c81e1e"/>
    <circle cx="18" cy="54" r="7" fill="#c81e1e"/>
    <circle cx="54" cy="54" r="7" fill="#c81e1e"/>
  </g>

  <g transform="translate(288,128) rotate(14)">
    <rect x="0" y="0" width="64" height="64" rx="10" fill="#f5f0e6" stroke="#7a5c00" stroke-width="4"/>
    <circle cx="32" cy="16" r="6" fill="#1a1a1a"/>
    <circle cx="16" cy="32" r="6" fill="#1a1a1a"/>
    <circle cx="48" cy="32" r="6" fill="#1a1a1a"/>
    <circle cx="32" cy="48" r="6" fill="#1a1a1a"/>
  </g>

  <!-- goblin ears / horns silhouette hint at top -->
  <path d="M186 96 C176 60 210 40 232 62 C218 74 210 90 210 108 Z" fill="url(#gold)" stroke="#7a5c00" stroke-width="3"/>
  <path d="M326 96 C336 60 302 40 280 62 C294 74 302 90 302 108 Z" fill="url(#gold)" stroke="#7a5c00" stroke-width="3"/>

  <!-- sparkle accents -->
  <g fill="#fff3b0">
    <path d="M392 150 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
    <path d="M112 240 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z"/>
  </g>
</svg>
